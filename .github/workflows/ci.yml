name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev,train,export]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=turn_detector --cov-report=term-missing
      - run: turn-detector validate-config --config configs/default.yaml
