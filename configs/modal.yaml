data:
  train_repo: pipecat-ai/smart-turn-data-v3.2-train
  test_repo: pipecat-ai/smart-turn-data-v3.2-test
  train_revision: null
  test_revision: null
  split: train
  languages: [hin, eng]
  output_dir: /vol/data
  cache_audio: true
  sample_rate: 16000
  max_seconds: 8.0
  trailing_silence_ms: 200
  validation_fraction: 0.05
  max_internal_pauses_per_clip: 2
  min_internal_pause_ms: 150
  max_internal_pause_ms: 1200
  min_future_speech_ms: 500
  seed: 42

model:
  base_model: openai/whisper-tiny
  base_model_revision: null
  architecture: dual_scale
  max_seconds: 8.0
  sample_rate: 16000
  n_mels: 80
  mel_frames: 800
  trailing_silence_ms: 200
  tail_seconds: 1.5
  attention_hidden_size: 128
  classifier_hidden_size: 256
  classifier_bottleneck_size: 64
  dropout: 0.1
  hold_loss_weight: 2.0
  filler_loss_weight: 0.15

train:
  output_dir: /vol/checkpoints
  train_manifest: /vol/data/train.jsonl
  validation_manifest: /vol/data/validation.jsonl
  seed: 42
  epochs: 4
  physical_batch_size: 64
  effective_batch_size: 256
  num_workers: 16
  encoder_learning_rate: 0.00001
  head_learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  freeze_encoder_steps: 500
  eval_steps: 500
  save_steps: 500
  early_stopping_patience: 2
  mixed_precision: bf16
  hindi_sampling_fraction: 0.50
  hard_negative_fraction: 0.30
  focused_sampling: true
  include_causal_pauses: true
  log_every_steps: 50

policy:
  threshold: 0.80
  temperature: 1.0
  min_silence_ms: 200
  timeout_ms: 1600
  speech_rms_threshold: 0.015

evaluation:
  test_manifest: /vol/data/test.jsonl
  output_dir: /vol/evaluation
  target_false_cutoff_rates: [0.05, 0.10]
  thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  action_delays_ms: [200, 300, 400, 600]
  timeouts_ms: [600, 1000, 1600, 2400]
  bootstrap_samples: 2000
  robustness_limit_per_slice: 1000
  seed: 42
